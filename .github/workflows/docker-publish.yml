name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish mode
        required: true
        type: choice
        default: snapshot
        options:
          - snapshot
          - release
  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: release

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.mode }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Validate release tag
        id: version
        run: |
          mode="${{ inputs.mode }}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "triplox") | .version')"

          if [[ "$mode" == "snapshot" ]]; then
            echo "version=$cargo_version-snapshot" >> "$GITHUB_OUTPUT"
            echo "minor=" >> "$GITHUB_OUTPUT"
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$mode" != "release" ]]; then
            echo "Unsupported Docker publish mode: $mode"
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "Release Docker images are only published from vX.Y.Z, vX.Y.Z-alpha.N, or vX.Y.Z-beta.N tags."
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "Tag version $version does not match Cargo workspace version $cargo_version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "snapshot=false" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "minor=" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=snapshot,enable=${{ steps.version.outputs.snapshot == 'true' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.stable == 'true' }}
            type=sha,prefix=sha-

      # The published image is always built with the kafka feature enabled
      # (rdkafka, which needs cmake). Kafka support is purely additive, so this
      # single image is a superset that serves every storage mode, kafka
      # included -- there is no separate -kafka variant.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_PACKAGES=cmake
            CARGO_FEATURES=kafka
          cache-from: type=gha
          cache-to: type=gha,mode=max
