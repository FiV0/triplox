[storage]
type = "remote"
endpoint = "http://localhost:9000"
bucket = "triplox"
access_key = "triplox"
secret_key = "triplox123"
cache_path = "/tmp/triplox-disk"
# Optional writer WAL flush interval in microseconds (default: 200000; must be positive).
# wal_flush_interval_us = 25000
# Optional CDC poll interval in microseconds (default: 200000; must be positive).
# Applies to remote storage with either file or Kafka logs.
# Controls checks for new subscription updates when caught up.
# Smaller values increase object-store requests. Local and memory nodes use 10ms.
# cdc_poll_interval_us = 25000

[log]
type = "file"
path = "/tmp/triplox-log/log"

[server]
host = "127.0.0.1"
port = 5490
