services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    # Dev-only credentials — do not use in production
    environment:
      MINIO_ROOT_USER: triplox
      MINIO_ROOT_PASSWORD: triplox123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
      mc alias set myminio http://minio:9000 triplox triplox123 &&
      mc mb --ignore-existing myminio/triplox
      "

  mc:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    tty: true
    stdin_open: true
    volumes:
      - mc-config:/root/.mc
    command: >
      -c "
      mc alias set triplox http://minio:9000 triplox triplox123 &&
      tail -f /dev/null
      "

  triplox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      TRIPLOX_STORAGE: remote
    ports:
      - "5490:5490"
    volumes:
      - triplox-log:/var/lib/triplox
    depends_on:
      createbucket:
        condition: service_completed_successfully

volumes:
  triplox-log:
  mc-config:
