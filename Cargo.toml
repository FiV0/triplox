[workspace]
members = [".", "edn", "triplox-client"]
exclude = [".claude"]

[workspace.package]
version = "0.1.0-alpha.8"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/FiV0/triplox"

[workspace.dependencies]
anyhow = "1.0"
bytes = { version = "1", features = ["serde"] }
chrono = "0.4.38"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
rmp = "0.8"
rmpv = "1.3"
serde = "1.0"
serde_derive = "1.0"
thiserror = "2.0.1"
uuid = "1.11.0"
edn = { package = "triplox-edn", path = "edn", version = "0.1.0-alpha.8", features = ["serde_support"] }
triplox-client = { path = "triplox-client", version = "0.1.0-alpha.8" }

[package]
name = "triplox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
bincode = "1.3"
bytes = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dbsp = "0.337.0"
edn = { workspace = true }
feldera-macros = "0.337.0"
triplox-client = { workspace = true }
futures = "0.3"
indexmap = "2.14.0"
itertools = "0.15"
log = "0.4"
rand = "0.10"
regex = "1.12.3"
rkyv = { version = "0.7.45", features = ["std", "size_64", "validation", "uuid"], default-features = false }
serde = { workspace = true, features = ["derive"] }
size-of = { version = "0.1.7", package = "feldera-size-of" }
slatedb = { git = "https://github.com/slatedb/slatedb", rev = "8aa2c10eb9ff3db3519f75f75d10e5487df29805", features = ["aws", "wal_disable"] }
slatedb-estimates = { git = "https://github.com/FiV0/slatedb-estimates", rev = "e1a7273d47eeeaca7a96341330d939c71a91843f" }
thiserror = { workspace = true }
toml = "1.1"
tokio = { version = "1.40.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true, features = ["serde"] }
fallible-iterator = "0.3.0"
axum = "0.8"
tower = "0.5"
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http2"] }
reqwest = { workspace = true }
rmp = { workspace = true }
rmpv = { workspace = true }
rdkafka = { version = "0.39", optional = true }

[features]
test-helpers = []
remote-test = []
kafka = ["dep:rdkafka"]
kafka-integration-test = ["kafka"]

[dev-dependencies]
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
tempfile = "3.14.0"
testcontainers = { version = "0.28", features = ["http_wait"] }
triplox = { path = ".", features = ["test-helpers"] }

[lints.rust]
unused = "allow"

[profile.bench]
debug-assertions = true
