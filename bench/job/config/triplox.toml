[storage]
type = "remote"
endpoint = "http://rustfs:9000"
bucket = "job"
access_key = "triplox"
secret_key = "triplox123"
cache_path = "/var/lib/triplox/cache"
# Only affects triplox-incremental; the CDC loop starts with the first subscription.
cdc_poll_interval_us = 100000

[log]
type = "file"
path = "/var/lib/triplox/log/log"

[server]
host = "0.0.0.0"
port = 5490
