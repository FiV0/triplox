name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run tests
        run: cargo test --all-features

      - name: Run edn tests
        run: cargo test -p triplox-edn --all-features

      - name: Run triplox-client tests
        run: cargo test -p triplox-client --all-features

  jvm-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      # Shares the cache with the integration-test job in job-benchmark.yml, which runs the same build.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: dev-server

      - name: Build server
        run: cargo build

      - name: Start dev server
        run: |
          cargo run -- config/triplox-dev.toml &
          for i in $(seq 1 30); do nc -z localhost 5490 && break || sleep 1; done

      # The last version listed (25) becomes the default JDK.
      - name: Set up Java 21 and 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle

      - name: Run unit tests
        run: cd triplox-jvm && ./gradlew test

      - name: Run integration tests
        run: cd triplox-jvm && ./gradlew integrationTest

      - name: Run unit and integration tests on Java 21
        run: |
          cd triplox-jvm
          ./gradlew test integrationTest \
            -PtestJavaVersion=21 \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64
