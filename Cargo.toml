[package]
name = "triplox"
version = "0.1.0"
edition = "2021"

[dependencies]
bigdecimal = { version = "0.4.5", features = ["serde"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
slatedb = "0.2.0"
time = { version = "0.3.36", features = ["serde"] }
uuid = { version = "1.10.0", features = ["serde"] }
