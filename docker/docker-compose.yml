services:
  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.93
    command: server /data --console-address ":9001"
    # Dev-only credentials — do not use in production
    environment:
      RUSTFS_ROOT_USER: triplox
      RUSTFS_ROOT_PASSWORD: triplox123
    ports:
      - "9000:9000"
      - "9001:9001"
    tmpfs:
      - /data:mode=1777
      - /logs:mode=1777
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
      mc alias set myrustfs http://rustfs:9000 triplox triplox123 &&
      mc mb --ignore-existing myrustfs/triplox
      "

  triplox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      TRIPLOX_STORAGE: remote
    ports:
      - "5490:5490"
    volumes:
      - triplox-log:/var/lib/triplox
    depends_on:
      createbucket:
        condition: service_completed_successfully

volumes:
  triplox-log:
