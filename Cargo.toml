[workspace]
members = [".", "edn"]
exclude = [".claude"]

[workspace.dependencies]
chrono = "0.4.38"
serde = "1.0"
serde_derive = "1.0"
uuid = "1.11.0"

[package]
name = "triplox"
version = "0.1.0-beta"
edition = "2021"

[dependencies]
anyhow = "1.0"
bigdecimal = { version = "0.4.5", features = ["serde"] }
bincode = "1.3"
bytes = { version = "1", features = ["serde"] }
chrono = { workspace = true, features = ["serde"] }
edn = { path = "./edn", features = ["serde_support"] }
futures = "0.3"
log = "0.4"
object_store = { version = "0.12.3", features = ["aws"] }
rand = "0.9"
serde = { workspace = true, features = ["derive"] }
slatedb = "0.12.0"
slatedb_estimates = { git = "https://github.com/FiV0/slatedb-estimates" }
thiserror = "2.0.1"
time = { version = "0.3.36", features = ["serde"] }
toml = "0.8"
tokio = { version = "1.40.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true, features = ["serde"] }
fallible-iterator = "0.3.0"
axum = "0.8"
tower = "0.5"
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http2"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }

[features]
test-helpers = []
remote-test = []

[dev-dependencies]
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
tempfile = "3.14.0"
testcontainers = { version = "0.25", features = ["http_wait"] }
triplox = { path = ".", features = ["test-helpers"] }

[lints.rust]
unused = "allow"

[profile.bench]
debug-assertions = true