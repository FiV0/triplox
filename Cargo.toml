[workspace]
members = [".", "edn", "triplox-client"]
exclude = [".claude"]

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/FiV0/triplox"

[workspace.dependencies]
anyhow = "1.0"
bytes = { version = "1", features = ["serde"] }
chrono = "0.4.38"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
rmp = "0.8"
rmpv = "1.3"
serde = "1.0"
serde_derive = "1.0"
thiserror = "2.0.1"
uuid = "1.11.0"
edn = { package = "triplox-edn", path = "edn", version = "0.1.0-alpha.4", features = ["serde_support"] }
triplox-client = { path = "triplox-client", version = "0.1.0-alpha.4" }

[package]
name = "triplox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
bincode = "1.3"
bytes = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
edn = { workspace = true }
triplox-client = { workspace = true }
futures = "0.3"
indexmap = "2.14.0"
log = "0.4"
object_store = { version = "0.12.3", features = ["aws"] }
rand = "0.9"
regex = "1"
serde = { workspace = true, features = ["derive"] }
# slatedb = { version = "0.12.0", features = ["wal_disable"] }
slatedb = { git = "https://github.com/slatedb/slatedb", rev = "e4a31506e78878e313a001e0ade760ddbda59dba", features = ["wal_disable"] }
slatedb_estimates = { git = "https://github.com/FiV0/slatedb-estimates", rev = "055bc31d4817b6354329c4929dfe6b5eab24d618" }
# slatedb_estimates = { path = "../slatedb-estimates" }
thiserror = { workspace = true }
toml = "0.8"
tokio = { version = "1.40.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true, features = ["serde"] }
fallible-iterator = "0.3.0"
axum = "0.8"
tower = "0.5"
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http2"] }
reqwest = { workspace = true }
rmp = { workspace = true }
rmpv = { workspace = true }

[features]
test-helpers = []
remote-test = []

[dev-dependencies]
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
tempfile = "3.14.0"
testcontainers = { version = "0.25", features = ["http_wait"] }
triplox = { path = ".", features = ["test-helpers"] }

[lints.rust]
unused = "allow"

[profile.bench]
debug-assertions = true