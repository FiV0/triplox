services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: triplox
      MINIO_ROOT_PASSWORD: triplox123
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 2s
      retries: 60
  createbucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: ["-c", "mc alias set local http://minio:9000 triplox triplox123 && mc mb --ignore-existing local/job"]
  triplox:
    image: ${JOB_TRIPLOX_IMAGE:-triplox:job-benchmark}
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    command: [/etc/triplox/job.toml]
    ports:
      - "127.0.0.1:${JOB_TRIPLOX_PORT:-15490}:5490"
    volumes:
      - ./config/triplox.toml:/etc/triplox/job.toml:ro
      - triplox-data:/var/lib/triplox
    depends_on:
      createbucket:
        condition: service_completed_successfully
volumes:
  minio-data:
  triplox-data:
