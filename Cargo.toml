[workspace]
members = [".", "edn"]
exclude = [".claude"]

[workspace.dependencies]
chrono = "0.4.38"
serde = "1.0"
serde_derive = "1.0"
uuid = "1.11.0"

[package]
name = "triplox"
version = "0.1.0-beta"
edition = "2021"

[dependencies]
anyhow = "1.0"
bigdecimal = { version = "0.4.5", features = ["serde"] }
bincode = "1.3"
bytes = { version = "1", features = ["serde"] }
chrono = { workspace = true, features = ["serde"] }
edn = { path = "./edn", features = ["serde_support"] }
futures = "0.3"
log = "0.4"
object_store = "0.11.1"
rand = "0.8.5"
serde = { workspace = true, features = ["derive"] }
slatedb = { git = "https://github.com/slatedb/slatedb.git", rev = "398b424" }
thiserror = "2.0.1"
time = { version = "0.3.36", features = ["serde"] }
toml = "0.8"
tokio = { version = "1.40.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true, features = ["serde"] }
fallible-iterator = "0.3.0"

[features]
test-helpers = []

[dev-dependencies]
tempfile = "3.14.0"
triplox = { path = ".", features = ["test-helpers"] }

[lints.rust]
unused = "allow"