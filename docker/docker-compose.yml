services:
  rustfs:
    image: rustfs/rustfs:1.0.0
    command: /data
    # Dev-only credentials — do not use in production
    environment:
      RUSTFS_ACCESS_KEY: triplox
      RUSTFS_SECRET_KEY: triplox123
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbucket:
    image: rustfs/rc:v0.1.36
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
      rc alias set triplox http://rustfs:9000 triplox triplox123 &&
      rc mb --ignore-existing triplox/triplox
      "

  rc:
    image: rustfs/rc:v0.1.36
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: /bin/sh
    tty: true
    stdin_open: true
    command: >
      -c "
      rc alias set triplox http://rustfs:9000 triplox triplox123 &&
      tail -f /dev/null
      "

  triplox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      TRIPLOX_STORAGE: remote
    ports:
      - "5490:5490"
    volumes:
      - triplox-log:/var/lib/triplox
    depends_on:
      createbucket:
        condition: service_completed_successfully

volumes:
  triplox-log:
  rustfs-data:
