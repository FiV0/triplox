[package]
name = "triplox"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1.83"
bigdecimal = { version = "0.4.5", features = ["serde"] }
bincode = "1.3"
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
edn = { path = "./edn" }
log = "0.4"
object_store = "0.11.1"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
# slatedb = "0.2.0"
slatedb = { git = "https://github.com/fiv0/slatedb.git", branch = "range-scans" }
thiserror = "2.0.1"
time = { version = "0.3.36", features = ["serde"] }
tokio = { version = "1.40.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11.0", features = ["serde"] }

[dev-dependencies]
tempfile = "3.14.0"

[lints.rust]
unused = "allow"