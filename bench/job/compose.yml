services:
  rustfs:
    image: rustfs/rustfs:1.0.0
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: triplox
      RUSTFS_SECRET_KEY: triplox123
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/health/ready]
      interval: 2s
      timeout: 2s
      retries: 60
  createbucket:
    image: rustfs/rc:v0.1.36
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: /bin/sh
    command: ["-c", "rc alias set local http://rustfs:9000 triplox triplox123 && rc mb --ignore-existing local/job"]
  triplox:
    image: ${JOB_TRIPLOX_IMAGE:-triplox:job-benchmark}
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    command: [/etc/triplox/job.toml]
    ports:
      - "127.0.0.1:${JOB_TRIPLOX_PORT:-15490}:5490"
    volumes:
      - ./config/triplox.toml:/etc/triplox/job.toml:ro
      - triplox-data:/var/lib/triplox
    depends_on:
      createbucket:
        condition: service_completed_successfully
volumes:
  rustfs-data:
  triplox-data:
